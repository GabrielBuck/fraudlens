services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fraudlens.db
      FRONTEND_URL: http://localhost:3000
      MODEL_ARTIFACT_PATH: /data/isolation_forest.joblib
      DETECTION_CONFIG_PATH: /app/config/detection.yaml
      AUTO_SEED: "true"
      DEFAULT_ACCOUNT_COUNT: "120"
      DEFAULT_TRANSACTION_COUNT: "5000"
    volumes:
      - fraudlens-data:/data
    init: true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    init: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens_local}
    volumes:
      - fraudlens-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudlens} -d ${POSTGRES_DB:-fraudlens}"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  fraudlens-data:
  fraudlens-postgres:
