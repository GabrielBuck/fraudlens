name: Docker CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build -t fraudlens-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t fraudlens-frontend-ci ./frontend

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Diagnose startup failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Smoke test services
        shell: bash
        run: |
          backend_ready=false
          frontend_ready=false

          for attempt in $(seq 1 60); do
            backend_ready=false
            frontend_ready=false

            if curl --fail --silent http://localhost:8000/health > /dev/null 2>&1; then
              backend_ready=true
            fi

            if curl --fail --silent http://localhost:3000/ > /dev/null 2>&1; then
              frontend_ready=true
            fi

            if [[ "$backend_ready" == "true" && "$frontend_ready" == "true" ]]; then
              echo "Backend and frontend are ready."
              exit 0
            fi

            echo "Attempt ${attempt}/60: backend=${backend_ready}, frontend=${frontend_ready}"
            sleep 5
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
