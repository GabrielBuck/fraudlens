name: Frontend CI
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fraudlens
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: fraudlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://fraudlens:fraudlens_ci@localhost:5432/fraudlens
      MODEL_ARTIFACT_PATH: ${{ github.workspace }}/backend/artifacts/isolation_forest.joblib
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]" psycopg[binary]
      - run: cd backend && alembic upgrade head
      - run: cd backend && fraudlens pipeline run-all --accounts 120 --transactions 5000 --seed 42
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        shell: bash
        run: nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/fraudlens-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: frontend
